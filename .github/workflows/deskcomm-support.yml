name: deskcomm-support

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  support-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Testar os limites do servidor de suporte
        run: node --test tools/deskcomm-support/*.check.mjs
      - name: Conferir artigos, evidências e catálogo
        run: node tools/deskcomm-support/catalog.mjs check
