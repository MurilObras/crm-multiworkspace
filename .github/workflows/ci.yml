name: ci

on:
  pull_request:
  push:
    branches: [main]

# O GITHUB_TOKEN destes jobs serve a `actions/checkout` (clone) e a
# `actions/setup-node` (manifest de `actions/node-versions`, repo público) —
# `contents: read` cobre os dois, que é o escopo que o próprio modelo de dados do
# CodeQL prescreve para essas duas actions. O `cache: pnpm` NÃO usa este token
# (usa ACTIONS_RUNTIME_TOKEN), `pnpm/action-setup` não tem input de token, e
# nenhum passo `run:` enxerga o token — ele só entra no ambiente via
# `secrets.GITHUB_TOKEN`, que não aparece em nenhum destes workflows.
#
# No topo, e não por job, porque os dois jobs precisam do mesmo escopo e job
# acrescentado depois nasce restrito em vez de herdar o default do repositório.
# Esse default hoje é `read` (medido em actions/permissions/workflow), então isto
# não corrige vazamento em vigor: tira a garantia de uma configuração que muda
# fora do repo, num clique, sem PR e sem deixar rastro aqui. `packages: write`
# continua por job em publish-image.yml — mesma regra, menor escopo que precisa.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Invariante 1 de docs/doctrine/restricao-de-canal.md: nenhuma feature
      # nomeia um provider. Step próprio (e não só dentro de `gov:verify`)
      # porque é o CI que gateia PR — `gov:verify` não é invocado por nenhum
      # workflow, e mecanismo que não roda no gate não protege nada.
      - name: Channel provider leak
        run: pnpm lint:channels

      - name: Unit tests
        run: pnpm test:unit


      # Scripts do kit self-host num repo git descartável (docker/crontab
      # dublados). É o único gate que exercita o update.sh — um erro aqui
      # rebobina a instalação de quem hospeda, e nenhum teste TS o veria.
      #
      # Desde 2026-08-08 inclui `hostgator-setup-kit/test-validators.sh`, os 163
      # casos que cobrem o install.sh. Eles existiam e NÃO rodavam em job nenhum
      # (issue #191): dois defeitos que tornavam a instalação impossível —
      # escolher OpenRouter travava o instalador num laço, escolher OpenAI
      # deixava o .env pela metade — passaram por todos os checks verdes. 15s.
      - name: Kit self-host (bash)
        run: pnpm test:shell

  # Gate de isolamento multi-tenant + invariantes de governança.
  # Job separado de propósito: roda em paralelo ao verify (não atrasa o feedback
  # rápido) e vira um check nomeado, que é o que a doutrina de RLS exige provar.
  # scripts/test-db.sh sobe pgvector/pgvector:pg17, aplica supabase/baseline.sql
  # em modo install (ON_ERROR_STOP=1) e update (idempotência), e roda
  # tests/invariants/** contra ele. Invocar via `pnpm test:db` é o que põe
  # node_modules/.bin no PATH que o script herda para chamar `vitest`.
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      - name: Três execuções isoladas da restauração Kiwify (zero erros não tratados)
        run: |
          set -euo pipefail
          for tentativa in 1 2 3; do
            echo "==> execução isolada ${tentativa}/3"
            # pnpm já repassa argumentos à script. Com `--` o Vitest tratava o
            # path como argumento pós-separador e rodava a suíte INTEIRA.
            pnpm test:db tests/invariants/kiwify-update-continuation.test.ts
          done

      - name: RLS isolation + governance invariants
        run: pnpm test:db

  # Harness nativo (Postgres + PostgREST reais) para as provas de idempotência de
  # escrita com transporte sintético: as rotas/handlers são reais, só o transporte
  # externo é substituído. Roda vitest.kiwify.config.ts (tests/invariants/kiwify*).
  kiwify-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth 0: o kiwify-validate-local.mjs/kiwify-stage-two-db.mjs fazem
      # `git show <commit histórico>:supabase/baseline.sql` (comparação install vs
      # upgrade); o clone raso não tem esse commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5

      - name: Subir Postgres descartável (trust) + aplicar baseline
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-contrib >/dev/null
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)
          # O prelude (extraído de scripts/test-db.sh pelos scripts kiwify-*) cria
          # `create extension vector` — o baseline usa o tipo public.vector. O
          # postgresql-contrib NÃO traz pgvector, então instalamos o pacote da
          # distro casando a major do Postgres; se a distro não o tiver, compilamos
          # do fonte (tag fixa, deterministic).
          PGMAJOR=$(basename "$(dirname "$PGBIN")")
          if ! sudo apt-get install -y -qq "postgresql-${PGMAJOR}-pgvector" >/dev/null 2>&1; then
            sudo apt-get install -y -qq "postgresql-server-dev-${PGMAJOR}" build-essential git >/dev/null
            git clone --branch v0.8.0 --depth 1 https://github.com/pgvector/pgvector.git /tmp/pgvector
            (cd /tmp/pgvector && make -s && sudo make -s install)
          fi
          sudo -u postgres "$PGBIN/initdb" -D /tmp/pgdata --auth=trust >/dev/null
          sudo -u postgres "$PGBIN/pg_ctl" -D /tmp/pgdata -o "-p 55432 -k /tmp" -l /tmp/pg.log start
          sleep 2
          echo "KIWIFY_TEST_PG_BIN=$PGBIN" >> "$GITHUB_ENV"
          echo "KIWIFY_TEST_PG_PORT=55432" >> "$GITHUB_ENV"
          echo "TEST_DB_PORT=55432" >> "$GITHUB_ENV"

      - name: Preparar kiwify_fresh/kiwify_test (baseline + migrations)
        run: |
          set -euo pipefail
          node scripts/kiwify-validate-local.mjs
          node scripts/kiwify-stage-two-db.mjs

      - name: Instalar PostgREST
        run: |
          set -euo pipefail
          PGRST=12.2.3
          curl -fsSL "https://github.com/PostgREST/postgrest/releases/download/v${PGRST}/postgrest-v${PGRST}-linux-static-x64.tar.xz" -o /tmp/postgrest.tar.xz
          tar -xJf /tmp/postgrest.tar.xz -C /tmp
          echo "KIWIFY_TEST_POSTGREST=/tmp/postgrest" >> "$GITHUB_ENV"

      - name: Provas de idempotência (PostgREST real + transporte sintético)
        run: pnpm exec vitest run --config vitest.kiwify.config.ts
        env:
          KIWIFY_TEST_NATIVE: "1"
